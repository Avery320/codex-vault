name: Bug report
description: Report a reproducible Codex Vault problem
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a Codex Vault issue. Do not attach private vault
        content, credentials, or personal filesystem paths. Use a small synthetic
        Markdown vault when possible.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start a new Codex task.
        2. Open @Codex Vault.
        3. ...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal synthetic Markdown
      description: Include only non-sensitive content needed to reproduce the problem.
      render: markdown
  - type: input
    id: plugin_version
    attributes:
      label: Codex Vault version
      description: Copy the version shown by `codex plugin list`.
    validations:
      required: true
  - type: input
    id: codex_version
    attributes:
      label: Codex App or CLI version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.x, Windows 11, Ubuntu 24.04, ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      description: Remove vault content, usernames, tokens, and private paths.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context
