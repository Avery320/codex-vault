name: Feature request
description: Propose an improvement to Codex Vault
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user workflow that is difficult today.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: Describe the smallest observable result that would solve it.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Area
      options:
        - Vault Explorer UI
        - Markdown reading or search
        - Chat context annotations
        - Backlinks or knowledge graph
        - Note write workflow
        - Vault management
        - Plugin installation or startup
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context or mockups
      description: Do not include private vault content.
