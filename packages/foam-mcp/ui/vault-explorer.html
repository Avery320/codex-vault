<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Codex Vault</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f5;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-solid: #fff;
        --text: #171716;
        --muted: #6f6f6a;
        --line: rgba(20, 20, 18, 0.11);
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.12);
        --chip: rgba(20, 20, 18, 0.055);
        --shadow: 0 12px 32px rgba(30, 30, 25, 0.08);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
      }

      :root[data-theme='dark'] {
        --bg: #171716;
        --panel: rgba(30, 30, 29, 0.88);
        --panel-solid: #20201f;
        --text: #f3f3ef;
        --muted: #aaa9a2;
        --line: rgba(255, 255, 255, 0.1);
        --accent: #82aaff;
        --accent-soft: rgba(130, 170, 255, 0.16);
        --chip: rgba(255, 255, 255, 0.07);
        --shadow: 0 16px 42px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app {
        display: grid;
        grid-template-rows: 54px minmax(0, 1fr);
        width: 100%;
        height: 100%;
      }

      .toolbar {
        display: grid;
        grid-template-columns: auto minmax(180px, 560px) 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 150px;
        font-weight: 680;
        letter-spacing: -0.02em;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--text);
        color: var(--panel-solid);
        font-size: 13px;
      }

      .search-wrap {
        position: relative;
      }

      .search-wrap span {
        position: absolute;
        left: 11px;
        top: 8px;
        color: var(--muted);
      }

      #search {
        width: 100%;
        height: 36px;
        padding: 0 12px 0 34px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        background: var(--chip);
        color: var(--text);
      }

      #search:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .stats {
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .actions {
        display: flex;
        gap: 7px;
      }

      .action {
        height: 34px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel-solid);
        cursor: pointer;
      }

      .action:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(300px, 0.92fr) minmax(
            380px,
            1.08fr
          );
        min-height: 0;
      }

      .pane {
        min-width: 0;
        min-height: 0;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }

      .pane:last-child {
        border-right: 0;
      }

      .pane-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 42px;
        padding: 0 13px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .scroll {
        height: calc(100% - 42px);
        overflow: auto;
      }

      #tree {
        padding: 8px;
      }

      details > summary {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 7px;
        color: var(--muted);
        cursor: pointer;
        list-style: none;
        font-size: 12px;
        font-weight: 650;
      }

      details > summary::-webkit-details-marker {
        display: none;
      }

      details > summary::before {
        content: '›';
        width: 12px;
        transition: transform 120ms ease;
      }

      details[open] > summary::before {
        transform: rotate(90deg);
      }

      .folder-content {
        padding-left: 10px;
      }

      .file {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        gap: 6px;
        width: 100%;
        padding: 7px 8px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .file:hover {
        background: var(--chip);
      }

      .file.active {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .file-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .graph-wrap {
        position: relative;
        height: calc(100% - 42px);
        overflow: hidden;
        background: radial-gradient(
            circle at 50% 40%,
            var(--accent-soft),
            transparent 34%
          ),
          var(--bg);
      }

      foam-graph {
        display: block;
        width: 100%;
        height: 100%;
      }

      .reader .scroll {
        background: var(--panel-solid);
      }

      .document {
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 36px clamp(22px, 5vw, 68px) 80px;
      }

      #note-path {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
      }

      #markdown {
        font-family: ui-serif, Georgia, 'Noto Serif TC', serif;
        font-size: 16px;
        line-height: 1.75;
      }

      #markdown h1,
      #markdown h2,
      #markdown h3 {
        line-height: 1.25;
        letter-spacing: -0.025em;
      }

      #markdown h1 {
        margin: 0 0 1.25rem;
        font-size: clamp(30px, 4vw, 46px);
      }

      #markdown h2 {
        margin-top: 2.2rem;
        padding-bottom: 0.3rem;
        border-bottom: 1px solid var(--line);
      }

      #markdown a {
        color: var(--accent);
        text-decoration: none;
      }

      #markdown code {
        padding: 0.15em 0.35em;
        border-radius: 5px;
        background: var(--chip);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
      }

      #markdown pre {
        overflow: auto;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--bg);
      }

      #markdown pre code {
        padding: 0;
        background: transparent;
      }

      #markdown blockquote {
        margin-left: 0;
        padding-left: 16px;
        border-left: 3px solid var(--accent);
        color: var(--muted);
      }

      .backlinks {
        margin-top: 42px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }

      .backlinks h3 {
        margin: 0 0 12px;
        font-family: inherit;
        font-size: 13px;
      }

      .backlink-list {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .chip {
        padding: 6px 9px;
        border: 0;
        border-radius: 999px;
        background: var(--chip);
        cursor: pointer;
      }

      .empty {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 24px;
        color: var(--muted);
        text-align: center;
      }

      .mobile-toggle {
        display: none;
      }

      @media (max-width: 980px) {
        .toolbar {
          grid-template-columns: auto minmax(150px, 1fr) auto;
        }

        .stats {
          display: none;
        }

        .mobile-toggle {
          display: inline-block;
        }

        .workspace {
          grid-template-columns: 240px minmax(0, 1fr);
        }

        .graph-pane,
        .reader {
          grid-column: 2;
          grid-row: 1;
        }

        .workspace:not(.show-graph) .graph-pane,
        .workspace.show-graph .reader {
          display: none;
        }
      }

      @media (max-width: 640px) {
        .brand {
          min-width: auto;
        }

        .brand-name,
        #fullscreen,
        #analyze {
          display: none;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .explorer,
        .graph-pane,
        .reader {
          grid-column: 1;
        }

        .explorer {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="brand">
          <span class="brand-mark">CV</span>
          <span class="brand-name">Codex Vault</span>
        </div>
        <label class="search-wrap">
          <span>⌕</span>
          <input
            id="search"
            type="search"
            placeholder="搜尋標題與 Markdown 正文…"
          />
        </label>
        <div id="stats" class="stats">正在載入知識庫…</div>
        <div class="actions">
          <button id="toggle-view" class="action mobile-toggle" type="button">
            圖譜
          </button>
          <button id="analyze" class="action" type="button">
            請 Codex 分析
          </button>
          <button id="fullscreen" class="action" type="button">全螢幕</button>
        </div>
      </header>
      <main id="workspace" class="workspace">
        <aside class="pane explorer">
          <div class="pane-head">
            <span>檔案</span><span id="file-count">0</span>
          </div>
          <div id="tree" class="scroll"></div>
        </aside>
        <section class="pane graph-pane">
          <div class="pane-head">
            <span>知識圖譜</span><span>拖曳・縮放・點選</span>
          </div>
          <div class="graph-wrap"><foam-graph id="graph"></foam-graph></div>
        </section>
        <section class="pane reader">
          <div class="pane-head">
            <span>Markdown</span><span id="note-path">尚未選擇筆記</span>
          </div>
          <div class="scroll">
            <article class="document">
              <div id="markdown" class="empty">
                從檔案列表或圖譜選擇一則筆記。
              </div>
              <section id="backlinks" class="backlinks" hidden>
                <h3>反向連結</h3>
                <div id="backlink-list" class="backlink-list"></div>
              </section>
            </article>
          </div>
        </section>
      </main>
    </div>
    <script>
      /*__CODEX_VAULT_BUNDLE__*/
    </script>
  </body>
</html>
