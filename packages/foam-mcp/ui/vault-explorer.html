<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Codex Vault</title>
    <style>
      /*__CODEX_VAULT_STYLE__*/
    </style>
  </head>
  <body>
    <div id="shell" class="shell">
      <nav class="ribbon" aria-label="工作區面板">
        <button
          id="toggle-sidebar"
          class="ribbon-button active"
          type="button"
          title="檔案"
          aria-label="顯示或隱藏檔案"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 5.5h6l2 2h9v11h-17z" />
          </svg>
        </button>
        <button
          id="show-note"
          class="ribbon-button active"
          type="button"
          title="目前筆記"
          aria-label="顯示目前筆記"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3.5h9l3 3v14H6z" />
            <path d="M15 3.5v4h4M9 12h6M9 16h6" />
          </svg>
        </button>
        <button
          id="toggle-graph"
          class="ribbon-button active"
          type="button"
          title="關聯圖檢視"
          aria-label="顯示或隱藏關聯圖檢視"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="6" cy="6" r="2" />
            <circle cx="18" cy="7" r="2" />
            <circle cx="12" cy="18" r="2" />
            <path d="m8 7 8 0M7 8l4 8m6-7-4 7" />
          </svg>
        </button>
      </nav>

      <aside class="sidebar">
        <header class="sidebar-header">
          <span>檔案</span>
          <span id="file-count" class="count">0</span>
        </header>
        <label class="search-row">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m16 16 4 4" />
          </svg>
          <input
            id="search"
            type="search"
            placeholder="搜尋筆記…"
            aria-label="搜尋標題與 Markdown 正文"
          />
        </label>
        <div id="tree" class="tree"></div>
        <footer class="vault-footer">
          <button id="vault-switcher" class="vault-switcher" type="button">
            <span class="vault-meta">
              <span id="vault-name">載入知識庫…</span>
              <span id="vault-path"></span>
            </span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 14 4-4 4 4" />
            </svg>
          </button>
          <div id="vault-menu" class="vault-menu" hidden></div>
        </footer>
      </aside>

      <div
        id="sidebar-resizer"
        class="pane-resizer sidebar-resizer"
        role="separator"
        aria-label="調整檔案面板寬度"
        aria-orientation="vertical"
      ></div>

      <main class="main">
        <div id="workspace" class="workspace">
          <section class="pane reader">
            <header class="tab-bar">
              <div class="workspace-tab active">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 3.5h9l3 3v14H6z" />
                  <path d="M15 3.5v4h4" />
                </svg>
                <span id="note-title">Markdown</span>
              </div>
            </header>
            <header class="view-header">
              <span id="note-path">尚未選擇筆記</span>
            </header>
            <div class="reader-scroll">
              <article class="document">
                <div id="markdown" class="empty">
                  從檔案列表或圖譜選擇一則筆記。
                </div>
                <section id="backlinks" class="backlinks" hidden>
                  <h2>反向連結</h2>
                  <div id="backlink-list" class="backlink-list"></div>
                </section>
              </article>
            </div>
          </section>

          <div
            id="workspace-resizer"
            class="pane-resizer workspace-resizer"
            role="separator"
            aria-label="調整 Markdown 與圖譜寬度"
            aria-orientation="vertical"
          ></div>

          <section class="pane graph-pane">
            <header class="tab-bar">
              <div class="workspace-tab active">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="6" cy="6" r="2" />
                  <circle cx="18" cy="7" r="2" />
                  <circle cx="12" cy="18" r="2" />
                  <path d="m8 7 8 0M7 8l4 8m6-7-4 7" />
                </svg>
                <span>關聯圖檢視</span>
              </div>
              <div class="tab-actions" aria-label="圖譜模式與設定">
                <button
                  id="graph-local-toggle"
                  class="tab-action icon-action"
                  type="button"
                  title="聚焦目前筆記"
                  aria-label="切換局部圖譜"
                  aria-pressed="false"
                  disabled
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M12 3v3M12 18v3M3 12h3M18 12h3" />
                  </svg>
                </button>
                <button
                  id="graph-settings-toggle"
                  class="tab-action icon-action"
                  type="button"
                  title="圖譜設定"
                  aria-label="開啟圖譜設定"
                  aria-expanded="false"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="3" />
                    <path
                      d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-4l-.4 3.1a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L6 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 3.1h4l.4-3.1a7 7 0 0 0 1.7-1l2.4 1 2-3.4L19 13a7 7 0 0 0 .1-1Z"
                    />
                  </svg>
                </button>
              </div>
            </header>
            <div id="graph-wrap" class="graph-wrap">
              <div class="graph-stage">
                <foam-graph id="graph"></foam-graph>
              </div>
              <aside id="graph-settings" class="graph-settings" hidden>
                <header class="graph-settings-header">
                  <span>圖譜設定</span>
                  <button
                    id="graph-settings-close"
                    class="tab-action icon-action"
                    type="button"
                    aria-label="關閉圖譜設定"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="m6 6 12 12M18 6 6 18" />
                    </svg>
                  </button>
                </header>

                <details open>
                  <summary>篩選</summary>
                  <div class="graph-settings-content">
                    <label class="graph-search">
                      <span>搜尋檔案</span>
                      <input
                        id="graph-filter"
                        type="search"
                        placeholder="輸入名稱或路徑…"
                      />
                    </label>
                    <label class="graph-check">
                      <input id="graph-show-tags" type="checkbox" checked />
                      <span>標籤</span>
                    </label>
                    <label class="graph-check">
                      <input id="graph-show-attachments" type="checkbox" />
                      <span>附件</span>
                    </label>
                    <label class="graph-check">
                      <input
                        id="graph-existing-files-only"
                        type="checkbox"
                        checked
                      />
                      <span>只顯示已存在檔案</span>
                    </label>
                    <label class="graph-check">
                      <input id="graph-show-orphans" type="checkbox" checked />
                      <span>孤立筆記</span>
                    </label>
                  </div>
                </details>

                <details open>
                  <summary>顯示</summary>
                  <div class="graph-settings-content">
                    <label class="graph-range">
                      <span>文字淡化</span>
                      <output id="graph-text-fade-value">0.0</output>
                      <input
                        id="graph-text-fade"
                        type="range"
                        min="-1"
                        max="1"
                        step="0.1"
                        value="0"
                      />
                    </label>
                    <label class="graph-range">
                      <span>節點大小</span>
                      <output id="graph-node-size-value">1.5×</output>
                      <input
                        id="graph-node-size"
                        type="range"
                        min="0.8"
                        max="2.5"
                        step="0.1"
                        value="1.5"
                      />
                    </label>
                    <label class="graph-range">
                      <span>連結粗細</span>
                      <output id="graph-link-width-value">1.0×</output>
                      <input
                        id="graph-link-width"
                        type="range"
                        min="0.5"
                        max="2"
                        step="0.1"
                        value="1"
                      />
                    </label>
                  </div>
                </details>

                <details>
                  <summary>作用力</summary>
                  <div class="graph-settings-content">
                    <label class="graph-range">
                      <span>排斥力</span>
                      <output id="graph-repel-value">30</output>
                      <input
                        id="graph-repel"
                        type="range"
                        min="5"
                        max="80"
                        step="1"
                        value="30"
                      />
                    </label>
                    <label class="graph-range">
                      <span>連結距離</span>
                      <output id="graph-link-distance-value">36</output>
                      <input
                        id="graph-link-distance"
                        type="range"
                        min="15"
                        max="100"
                        step="1"
                        value="36"
                      />
                    </label>
                  </div>
                </details>

                <details open>
                  <summary>局部圖譜</summary>
                  <div class="graph-settings-content">
                    <label class="graph-range">
                      <span>深度</span>
                      <output id="graph-depth-value">1</output>
                      <input
                        id="graph-depth"
                        type="range"
                        min="1"
                        max="4"
                        step="1"
                        value="1"
                      />
                    </label>
                  </div>
                </details>

                <button id="graph-reset" class="graph-reset" type="button">
                  還原預設值
                </button>
              </aside>
            </div>
          </section>
        </div>

        <footer class="status-bar">
          <div id="status">正在載入知識庫…</div>
        </footer>

        <section id="empty-vault" class="empty-vault" hidden>
          <div class="empty-vault-card">
            <h1>開啟知識庫</h1>
            <p>
              選擇既有 Obsidian Vault，或建立新的 Markdown 知識庫。Codex Vault
              只記錄路徑，不會搬移既有筆記。
            </p>
            <div class="empty-actions">
              <button id="open-existing" class="primary" type="button">
                開啟資料夾
              </button>
              <button id="create-new" class="secondary" type="button">
                建立知識庫
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="vault-dialog">
      <header class="dialog-header">
        <h2 id="vault-dialog-title">開啟知識庫</h2>
      </header>
      <form id="vault-form" class="vault-form">
        <label id="path-field" class="field">
          <span>知識庫資料夾路徑</span>
          <input id="vault-folder-path" type="text" required />
        </label>
        <label id="name-field" class="field" hidden>
          <span>知識庫名稱</span>
          <input id="vault-folder-name" type="text" />
        </label>
        <div id="dialog-error" class="dialog-error"></div>
        <div class="dialog-actions">
          <button id="dialog-cancel" class="secondary" type="button">
            取消
          </button>
          <button class="primary" type="submit">繼續</button>
        </div>
      </form>
    </dialog>

    <script>
      /*__CODEX_VAULT_BUNDLE__*/
    </script>
  </body>
</html>
